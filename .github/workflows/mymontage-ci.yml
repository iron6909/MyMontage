name: MyMontage CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mymontage-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integration:
    name: MyMontage integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt -r custom/requirements.txt
      - name: Run the integration gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .venv/bin/python -B -m custom.strategy.github_ci
