identity:
  name: "ny-english-shorts"
  category: custom
  mood: dry, sardonic, adult-satirical
  pace: moderate
  best_for: "Adult CEFR A2 English micro-drama in New Yorker ink-and-watercolor style, 9:16 vertical"

visual_language:
  color_palette:
    primary: ["#1A1816", "#4A453E"]
    accent: ["#C24E12", "#B85014"]
    background: "#F9F6F0"
    text: "#141210"
    muted: "#4A453E"
  composition: 9:16 vertical full-bleed, two-shot left-right staging, no empty white void
  texture: pen-and-ink linework with crosshatching plus full muted watercolor wash

typography:
  headings:
    font: "Georgia"
    weight: 600
    tracking: "-0.02em"
  body:
    font: "Georgia"
    weight: 600
    line_height: 1.32
  code:
    font: "Georgia"
    weight: 600
  stat_card:
    font: "Georgia"
    weight: 700
    size_multiplier: 2.0
  scale_system: "major_third"
  weight_matrix:
    title: 700
    heading: 600
    body: 600
    caption: 500

motion:
  transitions: [dissolve, push, slide-up]
  animation_style: "slow Ken Burns push/pull plus 0.3s cross-dissolve, ease-in-out, no bounce"
  pacing_rules:
    min_scene_hold_seconds: 2.0
    max_scene_hold_seconds: 30.0
    text_card_hold_seconds: 3.5
    stat_card_hold_seconds: 3.5
    transition_duration_seconds: 0.3
  entrance: "dissolve 0.3s, previous scene unmounts the moment the transition ends"
  exit: "fade-out 0.3s, never hold two scenes composited"

audio:
  voice_style: "dry sardonic storyteller plus three distinct role voices, verbatim read, no added words"
  music_mood: "light witty European chamber plucked strings, comic bed, no synth beeps"
  music_volume: 0.18
  sfx_style: "single page-flip on glossary card turn, soft"
  ducking_threshold_db: -4

asset_generation:
  image_prompt_prefix: "ink and watercolor sketch, editorial cartoon illustration in the style of The New Yorker magazine, clean black ink linework, expressive crosshatching, muted watercolor wash, full 19th century town market square background with cobblestone street, wooden stalls and distant period buildings, vertical 9:16 portrait composition, "
  image_negative_prompt: "duplicate person, two policemen, extra person, cloned face, two dogs, extra dog, large dog, apron on officer, peaked cap on worker, pink cheeks, photorealistic, 3d, anime, empty white background, blank background, text, watermark, border"
  diagram_style: "full-bleed watercolor town background in every frame, never isolated on pure white"
  consistency_anchors:
    - "Officer Leo always: tall, mustached, black peaked cap with badge, dark double-breasted overcoat, never an apron"
    - "Carpenter always: stout, grey flat cap, brown leather bib apron, never a peaked cap"
    - "Cook always: thin older civilian, white apron, never a peaked cap or brown apron"
    - "Exactly one tiny white puppy per frame unless the script says otherwise"
    - "Two-shot left-right staging is fixed per scene; never share one frame across two attitude-reversal beats"

overlays:
  key_term:
    bg: "rgba(249, 246, 240, 0.95)"
    text: "#C24E12"
    radius: 24

quality_rules:
  - "CEFR A2 only: every word inside Oxford 3000, 10 scenes / 25 sentences / 5 glossary chunks"
  - "Three reversals stay in separate scenes and never rewind or repeat logic in the second half"
  - "Every English dialogue line uses standard double quotes; quoted lines use the role voice"
  - "No scene frame is reused across two attitude-reversal beats"
  - "Full watercolor town background in every frame; pure-white empty background is rejected"
  - "Subtitle card: rgba(249,246,240,0.95), 1px border, radius 24, bottom 180, English weight 600 (unread #4A453E, read #141210, current #C24E12), Chinese 36px #3D3832"
  - "Short trailing narration of 8 words or fewer merges into the previous card, never flashes alone"
  - "Transitions are 0.3s only with immediate unmount of the outgoing scene; full-color art uses normal blend, never multiply"
  - "Minimum contrast ratio 4.5:1 for all text"
  - "BGM is real instrumental chamber music at -26 LUFS with 3s end fade, never programmatic synth"

chart_palette:
  - "#C24E12"
  - "#1A1816"
  - "#4A453E"
  - "#B85014"
  - "#6F665A"
  - "#D9D1C2"

color_rules:
  harmony_type: "analogous"
  contrast_validation: true
  colorblind_safe: true
